name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14   # Apple Silicon (arm64): the vendored package binaries run here
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify platform and pinned JACKAL package identity
        # v2 no longer tracks a single bin/jackal-native. It vendors the pinned
        # upstream v1.1.1 release package and admits binaries from it (hash +
        # manifest + per-binary Mach-O/arch/mode). The hosted gate pins the
        # PACKAGE, which is what the plugin actually trusts.
        run: |
          test "$(uname -m)" = arm64
          test "$(shasum -a 256 pkg/jackal-v1.1.1-macos-arm64.tar.gz | awk '{print $1}')" = "8ed047183bdd6259fc3d9b22ab87003389eabf9c4da1722024848c016fc4ec09"
      - name: Compile Python
        run: python3 -m compileall -q __init__.py schemas.py tools.py jackal_formal tests scripts
      - name: Run unit and admission suite
        run: python3 tests/test_plugin.py
      - name: Run v2 formal + poison suite (default)
        run: python3 tests/test_plugin_v2.py
      - name: Run v2 formal + poison suite (-O parity)
        # Identical verdict under -O proves no load-bearing `assert` on any gate.
        run: python3 -O tests/test_plugin_v2.py
      - name: A→B→A — formal re-check gate is load-bearing
        # Disables the checker-re-run gate in-source; the four Hermes forgeries
        # must be re-admitted (B), then refuse again after hash-verified restore.
        run: python3 tests/aba_recheck_gate.py
      - name: Run fresh-install registration smoke test
        run: python3 scripts/fresh_install_smoke.py
      - name: Verify sealed manifest
        run: python3 scripts/verify_manifest.py
      - name: Reject forbidden tracked paths
        run: python3 scripts/release_audit.py
