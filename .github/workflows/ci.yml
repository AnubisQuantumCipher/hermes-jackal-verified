name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14   # Apple Silicon (arm64): the vendored package binaries run here
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify platform and pinned JACKAL package identity
        # v3.0.0 vendors the pinned upstream v1.4.2 release package and admits
        # binaries + Gaussian checker + producers from it (hash + manifest +
        # per-binary Mach-O/arch/mode). The hosted gate pins the PACKAGE.
        run: |
          test "$(uname -m)" = arm64
          test "$(shasum -a 256 pkg/jackal-v1.4.2-macos-arm64.tar.gz | awk '{print $1}')" = "30b1a7441cdd9c1b0f24ac6d187608d3235f1ced6c57469dc1b1f697f475b1a0"
      - name: Compile Python
        run: python3 -m compileall -q __init__.py schemas.py tools.py jackal_formal tests scripts
      - name: Run unit and admission suite
        run: python3 tests/test_plugin.py
      - name: Run v2 formal + poison suite (default)
        run: python3 tests/test_plugin_v2.py
      - name: Run v2 formal + poison suite (-O parity)
        # Identical verdict under -O proves no load-bearing `assert` on any gate.
        run: python3 -O tests/test_plugin_v2.py
      - name: A->B->A - master formal re-check gate is load-bearing across every lane
        # Disables the checker-re-run gate in-source; the master-gate-only
        # forgeries must be re-admitted (B) across all four lanes
        # (range/gaussian/sqrt_rat/exp_rat), then refuse again after
        # hash-verified restore. Under python3 and python3 -O.
        run: |
          python3 tests/aba_recheck_gate.py
          python3 -O tests/aba_recheck_gate.py
      - name: Run fresh-install registration smoke test
        run: python3 scripts/fresh_install_smoke.py
      - name: Verify sealed manifest
        run: python3 scripts/verify_manifest.py
      - name: Reject forbidden tracked paths
        run: python3 scripts/release_audit.py
