name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Verify platform and pinned JACKAL package identity
        run: |
          test "$(uname -m)" = "arm64"
          test "$(shasum -a 256 pkg/jackal-v1.6.0-macos-arm64.tar.gz | cut -d' ' -f1)" \
            = "0cdacf56bb83d65454330973280cde7da0b9262d6163ccd7efbbbb47bc88e39a"

      - name: Verify epoch receipt binds the vendored package
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("EPOCH.json"))
          assert d["schema"] == "jackal-plugin-epoch-receipt-v1"
          assert d["upstream"]["release_epoch"] == "v1.6.0"
          assert d["vendored"]["sha256"] == \
              "0cdacf56bb83d65454330973280cde7da0b9262d6163ccd7efbbbb47bc88e39a"
          assert d["plugin"]["version"] == "4.0.0"
          print("EPOCH_RECEIPT_OK")
          PY

      - name: Compile all sources
        run: python3 -m compileall -q __init__.py schemas.py tools.py tests scripts

      - name: Schemas are generated from the vendored surface (no drift)
        run: |
          python3 scripts/gen_schemas.py
          git diff --exit-code schemas.py

      - name: Unit battery (18 cases)
        run: python3 tests/test_plugin.py

      - name: Poison battery (36 rows)
        run: python3 tests/test_plugin_v2.py

      - name: Poison battery under -O (optimized parity)
        run: python3 -O tests/test_plugin_v2.py

      - name: A->B->A identity-enforcement gate
        run: python3 tests/aba_recheck_gate.py

      - name: Fresh-install smoke
        run: python3 scripts/fresh_install_smoke.py

      - name: Verify sealed manifest
        run: python3 scripts/verify_manifest.py

      - name: Release audit (no secrets, no forbidden paths)
        run: python3 scripts/release_audit.py
