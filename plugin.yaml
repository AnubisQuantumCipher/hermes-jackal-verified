name: jackal-verified
version: "6.0.0"
manifest_version: 1
api_version: 1
description: >-
  Typed adapter for the reproducible JACKAL v1.7.3 candidate: 41 tools
  derived from the package catalog, including exact and numerical lanes,
  Lean-checked formal-bounded lanes, claim compilation and replay,
  structural and decision checks, and caller-pinned Anubis program-evidence
  verification. Each call invokes the vendored runtime frontend inside an
  admitted private snapshot. The adapter parses one runtime result object;
  admission, argument-length, timeout, execution, and transport failures
  produce named local refusals. Candidate state does not assert a public
  v1.7.3 tag or release asset.
author: Anubis Quantum Cipher
license: MIT
kind: standalone
tags: [mathematics, verification, formal-methods, interval-arithmetic, evidence]
provides_tools:
  - jackal_alg_cmp
  - jackal_alg_sign
  - jackal_anubis_check_program
  - jackal_anubis_verify_program
  - jackal_anubis_verify_program_receipt
  - jackal_atan_rat_bound
  - jackal_canon
  - jackal_claim
  - jackal_claim_cites_test
  - jackal_cos_rat_bound
  - jackal_crt
  - jackal_decision_rank
  - jackal_decision_rank_v2
  - jackal_diff
  - jackal_divides
  - jackal_evaluate
  - jackal_exact
  - jackal_exp_rat_bound
  - jackal_gaussian_integral
  - jackal_integrate
  - jackal_integrate_adaptive
  - jackal_integrate_bound
  - jackal_integrate_bound_cert
  - jackal_ln_rat_bound
  - jackal_mod_inv
  - jackal_mod_pow
  - jackal_poly_canon
  - jackal_poly_eq
  - jackal_poly_gcd
  - jackal_prime_cert
  - jackal_range_bound
  - jackal_ratfunc_canon
  - jackal_roots_isolate
  - jackal_sin_rat_bound
  - jackal_solve
  - jackal_sqrt_rat_bound
  - jackal_tanh_rat_bound
  - jackal_test_exists
  - jackal_verify_bundle
  - jackal_verify_receipt
  - jackal_xgcd
provides_skills: [jackal-verified-computation]
config_schema:
  timeout_seconds:
    type: integer
    default: 180
  max_expression_chars:
    type: integer
    default: 8192
