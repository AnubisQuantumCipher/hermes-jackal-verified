name: jackal-verified
version: "4.0.0"
manifest_version: 1
api_version: 1
description: >-
  Typed, receipt-bearing access to the sealed JACKAL v1.6.0 Mathematical
  Evidence Kernel: 33 tools — nine proof-carrying formal-bounded lanes
  (range, gaussian, sqrt_rat, exp_rat, ln_rat, sin_rat, cos_rat, atan_rat,
  tanh_rat) whose receipts are re-verified by pinned Lean-proved checkers,
  twenty-one honest weaker/exact-CAS lanes with status passthrough that
  never inflates, independent receipt verification, and the v1.6.0
  claim-kernel front doors jackal_claim / jackal_verify_bundle for
  compiling and independently replaying content-addressed evidence
  bundles. Every call runs inside an admitted, hash-pinned private
  snapshot of the public v1.6.0 release package.
author: Anubis Quantum Cipher
license: MIT
kind: standalone
tags: [mathematics, verification, formal-methods, interval-arithmetic, evidence]
provides_tools:
  - jackal_alg_cmp
  - jackal_alg_sign
  - jackal_atan_rat_bound
  - jackal_canon
  - jackal_claim
  - jackal_cos_rat_bound
  - jackal_crt
  - jackal_diff
  - jackal_divides
  - jackal_evaluate
  - jackal_exact
  - jackal_exp_rat_bound
  - jackal_gaussian_integral
  - jackal_integrate
  - jackal_integrate_adaptive
  - jackal_integrate_bound
  - jackal_ln_rat_bound
  - jackal_mod_inv
  - jackal_mod_pow
  - jackal_poly_canon
  - jackal_poly_eq
  - jackal_poly_gcd
  - jackal_prime_cert
  - jackal_range_bound
  - jackal_ratfunc_canon
  - jackal_roots_isolate
  - jackal_sin_rat_bound
  - jackal_solve
  - jackal_sqrt_rat_bound
  - jackal_tanh_rat_bound
  - jackal_verify_bundle
  - jackal_verify_receipt
  - jackal_xgcd
provides_skills: [jackal-verified-computation]
